name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - "*.md"
      - "k8s/**"
      - "helm/**" # because CI writes here and don't wanna trigger again
      - "scripts/**"
    tags:
      - "v*.*.*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Go Install
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Test
        run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  release:
    needs:
    - test
    - lint
    permissions:
      contents: write
    name: Build & Release on Github
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - run: go build -o go-web-app
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: go-web-app

  release-docker-hub:
    needs:
    - test
    - lint
    name: Push to Docker Hub
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app
        tags: |
          # 1. Matches GitHub Git tag exactly
          type=ref,event=tag
          
          # 2. Matches GitHub commit SHA (use format=short for an 8-character SHA)
          type=sha,format=long
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: ${{ steps.meta.outputs.tags }}

  write-helm-values:
    needs: release-docker-hub
    permissions:
      contents: write # to commit changes
    name: Write HELM Chart values.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update tag in values.yaml
        run: yq -i '.image.tag = "${{ github.ref_name }}"' helm/go-web-app-chart/values.yaml
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: "helm/go-web-app-chart/values.yaml"
          commit_message: Update helm chart .image.tag
