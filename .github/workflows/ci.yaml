name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - "*.md"
      - "k8s/**"
      - "helm/**"
      - "scripts/**"
    tags:
      - "v*.*.*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Go Install
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Test
        run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  release:
    needs:
    - test
    - lint
    name: Build & Release on Github
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - run: go build -o go-web-app
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: go-web-app
