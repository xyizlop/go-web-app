name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - "*.md"
      - "k8s/**"
      - "helm/**"
      - "scripts/**"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Go Install
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Test
        run: go test ./...
