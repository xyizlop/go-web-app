apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: go-web-app
  region: ap-south-1

managedNodeGroups:
  - name: managed-ng-1
    minSize: 1
    maxSize: 2
    desiredCapacity: 1
    instanceType: t3.medium
    privateNetworking: true
vpc:
  cidr: "10.0.0.0/24"

autoModeConfig:
  enabled: false
