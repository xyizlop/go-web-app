apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-alb-gateway-class
spec:
  controllerName: gateway.k8s.aws/alb
---
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: external-lb
spec:
  scheme: internet-facing
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: argocd-server-tg
  namespace: argocd
spec:
  targetReference:
    group: ""
    kind: Service
    name: argocd-server-exposed
  defaultConfiguration:
    protocol: HTTPS
    healthCheckConfig:
      healthCheckProtocol: HTTPS
      healthCheckPath: /healthz
      healthCheckPort: traffic-port
      matcher:
        httpCode: "200-399"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: alb-gateway
spec:
  gatewayClassName: aws-alb-gateway-class
  infrastructure:
    parametersRef:
      kind: LoadBalancerConfiguration
      name: external-lb
      group: gateway.k8s.aws
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
---
kind: HTTPRoute
metadata:
  name: go-web-app
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: alb-gateway
      sectionName: http
  hostnames:
  - "go-web-app.local"
  rules:
    - backendRefs:
        - name: go-web-app
          port: 8080
---
kind: HTTPRoute
metadata:
  name: argocd
  lables:
    app: go-web-app
    cd: argocd
  namespace: argocd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: alb-gateway
      sectionName: https
  hostnames:
  - "argocd.devstuffs.com"
  rules:
    - backendRefs:
        - name: argocd-server
          port: 443
